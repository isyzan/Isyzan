name: ISYZAN VPN Auto-Renew

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  renew:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install requests
        run: pip install requests

      - name: Run ISYZAN VPN script
        run: python isyzan.py
